# Nginx Virtual Host Configuration for sampayan.rioph.com
# Location on VPS: /etc/nginx/sites-available/sampayan.rioph.com

server {
    listen 80;
    listen [::]:80;
    server_name sampayan.rioph.com;

    # Redirect HTTP to HTTPS (Managed automatically by Certbot)
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sampayan.rioph.com;

    # SSL Certificate Paths (Certbot managed)
    # ssl_certificate /etc/letsencrypt/live/sampayan.rioph.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/sampayan.rioph.com/privkey.pem;

    # REST API endpoints
    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket connections (/ws/device & /ws/client)
    location /ws/ {
        proxy_pass http://127.0.0.1:4000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s; # Prevent timeout on persistent WebSockets
        proxy_send_timeout 86400s;
    }

    # Optional default root fallback
    location / {
        proxy_pass http://127.0.0.1:4000/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
